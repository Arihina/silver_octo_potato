services:

  # ---------- Qdrant ----------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ---------- Ollama ----------
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Для GPU — раскомментировать блок deploy:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------- RAG API ----------
  rag:
    build: .
    container_name: rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/app/data
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=gemma2:2b
      - DATA_DIR=/app/data
    depends_on:
      - qdrant
      - ollama

volumes:
  qdrant_data:
  ollama_data:
  rag_data:
  